
name: Build Hill Climb Game

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ZIP
        run: |
          mkdir -p dist
          zip -j dist/pro-hill-climb.zip index.html style.css script.js

      - uses: actions/upload-artifact@v4
        with:
          name: Pro-Hill-Climb-Game
          path: dist/pro-hill-climb.zip
  
